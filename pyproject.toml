[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wheredidit"
version = "0.1.0"
description = "Find files by what was inside them, not by name. Local, offline, Arabic and English."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["openpyxl>=3.1", "python-docx>=1.1", "python-pptx>=0.6.23", "pypdfium2>=4.30"]

[project.optional-dependencies]
dev = ["pytest", "reportlab", "pillow"]

[project.scripts]
wheredidit = "wheredidit.cli:main"

[tool.setuptools]
packages = ["wheredidit"]
